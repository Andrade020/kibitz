name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # roda sem publicar: só gera o instalador como artefato

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer (signs automatically if the certificate secrets exist)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installer/*
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/installer/*.exe
      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $flags = @(); if ($tag -match '-') { $flags += "--prerelease" }
            gh release create $tag --title $tag --generate-notes @flags
          }
          gh release upload $tag (Get-ChildItem build/installer/*) --clobber
